<style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic} .bar{animation:bars 3.6s cubic-bezier(.4,0,.2,1) infinite} .b1{animation-delay:.25s} .b2{animation-delay:.5s} @keyframes bars{50%{transform:scaleY(.6)}} .w0{animation:word 12s -12s infinite} .w1{animation:word 12s -9.6s infinite} .w2{animation:word 12s -7.2s infinite} .w3{animation:word 12s -4.800000000000001s infinite} .w4{animation:word 12s -2.4000000000000004s infinite}
