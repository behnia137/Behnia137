<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" fill="none">
<style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic}  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0.75" y=".75" width="286.5" height="234.5" rx="18" fill="#0f0f15" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
    <text x="24" y="52" font-size="34" class="serif" fill="#2f7cf6">01</text>
    <text x="24" y="96" font-size="21" font-weight="800" letter-spacing="-.4" fill="#f5f5f7">Researched first</text>
    <text font-size="17" fill="#a8a8b5"><tspan x="24" y="134">A tool about another</tspan><tspan x="24" y="160">product names the version</tspan><tspan x="24" y="186">it was checked against.</tspan></text>
<rect x="304.75" y=".75" width="286.5" height="234.5" rx="18" fill="#0f0f15" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
    <text x="328" y="52" font-size="34" class="serif" fill="#20c997">02</text>
    <text x="328" y="96" font-size="21" font-weight="800" letter-spacing="-.4" fill="#f5f5f7">Tested on every build</text>
    <text font-size="17" fill="#a8a8b5"><tspan x="328" y="134">Every tool has its own</tspan><tspan x="328" y="160">tests, every page a weight</tspan><tspan x="328" y="186">budget, checked each build.</tspan></text>
<rect x="608.75" y=".75" width="286.5" height="234.5" rx="18" fill="#0f0f15" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
    <text x="632" y="52" font-size="34" class="serif" fill="#ffc233">03</text>
    <text x="632" y="96" font-size="21" font-weight="800" letter-spacing="-.4" fill="#f5f5f7">Private by default</text>
    <text font-size="17" fill="#a8a8b5"><tspan x="632" y="134">No account, no cookies,</tspan><tspan x="632" y="160">no trackers. What you type</tspan><tspan x="632" y="186">stays in your browser.</tspan></text>
<rect x="912.75" y=".75" width="286.5" height="234.5" rx="18" fill="#0f0f15" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
    <text x="936" y="52" font-size="34" class="serif" fill="#ff5fa8">04</text>
    <text x="936" y="96" font-size="21" font-weight="800" letter-spacing="-.4" fill="#f5f5f7">Taught, not just shipped</text>
    <text font-size="17" fill="#a8a8b5"><tspan x="936" y="134">A course for every tool,</tspan><tspan x="936" y="160">release notes for every</tspan><tspan x="936" y="186">change.</tspan></text>
</svg>
