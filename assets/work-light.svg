      <circle cx="752" cy="40" r="5.5" fill="#ffc233" class="dot" style="transform-origin:752px 40px;animation-delay:0.5s"/>
      <text x="434" y="92" font-size="25" font-weight="800" letter-spacing="-.6" fill="#0b0b10">Analytics &amp; BI</text>
      <text font-size="18" fill="#474753"><tspan x="434" y="128">KPIs defined once, and reports</tspan><tspan x="434" y="152">a manager reads at a glance.</tspan></text>
<rect x="816.75" y="0.75" width="382.5" height="174.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
