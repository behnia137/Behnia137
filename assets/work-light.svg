      <text x="842" y="92" font-size="25" font-weight="800" letter-spacing="-.6" fill="#0b0b10">Machine learning</text>
      <text font-size="18" fill="#474753"><tspan x="842" y="128">Forecasts and scores the</tspan><tspan x="842" y="152">business can check.</tspan></text>
<rect x="0.75" y="196.75" width="382.5" height="174.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
      <rect x="18" y="196" width="348" height="3" rx="1.5" fill="#e0805c"/>
