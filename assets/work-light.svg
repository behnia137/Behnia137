<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" fill="none">
<style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic} .move{animation:move 1.6s linear infinite} @keyframes move{to{stroke-dashoffset:-40}}
    .dot{animation:dot 3s ease-in-out infinite} @keyframes dot{0%,100%{transform:scale(1)} 10%{transform:scale(1.7)} 25%{transform:scale(1)}} @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
