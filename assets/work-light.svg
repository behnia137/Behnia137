      <text x="26" y="92" font-size="25" font-weight="800" letter-spacing="-.6" fill="#0b0b10">Data engineering</text>
      <text font-size="18" fill="#474753"><tspan x="26" y="128">Pipelines that run every night</tspan><tspan x="26" y="152">with nobody watching.</tspan></text>
<rect x="408.75" y="0.75" width="382.5" height="174.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
      <rect x="426" y="0" width="348" height="3" rx="1.5" fill="#ffc233"/>
