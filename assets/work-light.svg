  <path d="M 192 40 H 1008" stroke="rgba(16,18,27,.10)" stroke-width="2"/><path d="M 192 40 H 1008" stroke="url(#rb)" stroke-width="2.5" stroke-dasharray="6 14" class="move"/><path d="M 192 236 H 1008" stroke="rgba(16,18,27,.10)" stroke-width="2"/><path d="M 192 236 H 1008" stroke="url(#rb)" stroke-width="2.5" stroke-dasharray="6 14" class="move"/>
  <rect x="0.75" y="0.75" width="382.5" height="174.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
      <rect x="18" y="0" width="348" height="3" rx="1.5" fill="#20c997"/>
