      <text x="26" y="288" font-size="25" font-weight="800" letter-spacing="-.6" fill="#0b0b10">AI &amp; LLM engineering</text>
      <text font-size="18" fill="#474753"><tspan x="26" y="324">RAG, agents that call real tools,</tspan><tspan x="26" y="348">evals that keep answers right.</tspan></text>
