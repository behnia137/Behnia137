      <circle cx="752" cy="236" r="5.5" fill="#a577ff" class="dot" style="transform-origin:752px 236px;animation-delay:2s"/>
      <text x="434" y="288" font-size="25" font-weight="800" letter-spacing="-.6" fill="#0b0b10">Software &amp; automation</text>
      <text font-size="18" fill="#474753"><tspan x="434" y="324">Complete apps, tested on every</tspan><tspan x="434" y="348">build, and the scripts around them.</tspan></text>
<rect x="816.75" y="196.75" width="382.5" height="174.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
