      <text x="842" y="288" font-size="25" font-weight="800" letter-spacing="-.6" fill="#0b0b10">Design &amp; interfaces</text>
      <text font-size="18" fill="#474753"><tspan x="842" y="324">One design system, light and</tspan><tspan x="842" y="348">dark, from icons to motion.</tspan></text>
  <text x="0" y="408" font-size="17" fill="#666671">From raw data to the screen people read it on, and the AI in between. Claude Code and MCP are where I go deepest.</text>
